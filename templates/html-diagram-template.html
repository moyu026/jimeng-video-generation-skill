<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HTML Diagram Template</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{display:grid;place-items:center;cursor:default}
body.recording{cursor:none}
.stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:#f7f9fc;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.title{position:absolute;left:4%;right:4%;top:4%;margin:0;color:#1e49b7;font-size:clamp(24px,2.2vw,42px);font-weight:560;opacity:0;transform:translateY(-10px);animation:in .7s ease forwards}
.diagram{position:absolute;left:6%;right:6%;top:16%;bottom:12%;border:3px dashed #17365f;border-radius:28px;background:rgba(255,255,255,.65);opacity:0;transform:translateY(18px);animation:in .7s .25s ease forwards}
.replay-zone{position:absolute;right:0;bottom:0;width:120px;height:80px;z-index:20}
body.recording .replay-zone{display:none}
.replay{position:absolute;right:18px;bottom:16px;border:1px solid rgba(23,54,95,.18);background:rgba(255,255,255,.72);color:#536681;border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer;opacity:0;transition:opacity .2s ease}
.replay-zone:hover .replay{opacity:.35}.replay:hover{opacity:.78}
@keyframes in{to{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <h1 class="title">Diagram Title</h1>
  <section class="diagram" aria-label="diagram stage"></section>
  <div class="replay-zone"><button class="replay" onclick="replay()">Replay</button></div>
</main>
<script>
function replay(){const oldStage=document.getElementById('stage');const newStage=oldStage.cloneNode(true);oldStage.parentNode.replaceChild(newStage,oldStage)}
const params=new URLSearchParams(window.location.search);
if(params.get('record')==='1'){document.body.classList.add('recording')}
window.addEventListener('keydown',e=>{if(e.key&&e.key.toLowerCase()==='r')replay()});
</script>
</body>
</html>
